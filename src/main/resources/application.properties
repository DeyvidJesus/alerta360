spring.application.name=alerta360
server.port=${SERVER_PORT:3000}

# Banco de dados - os valores padrao servem apenas para o ambiente local (docker-compose)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:alerta360}
spring.datasource.password=${DB_PASSWORD:DBalerta360}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Documentacao da API (Swagger UI em /swagger-ui.html)
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
